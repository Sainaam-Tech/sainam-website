{{ if site.Params.announcement.enable }}
  <div class="z-50 relative">
    <div class="glass border-none shadow-lg py-2 px-4 flex flex-col md:flex-row items-center justify-center gap-4 text-center">
      <div class="flex items-center gap-2">
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
        </span>
        <p class="text-sm font-bold tracking-tight text-slate-900 dark:text-white">
          🚀 We're rolling out a <span class="bg-primary/10 text-primary px-2 py-0.5 rounded-md">Procurement Software</span> in Beta soon!
        </p>
      </div>
      <div class="flex items-center gap-4">
        <p class="text-xs font-medium opacity-80 hidden md:block">Be the first to see it.</p>
        <button 
          data-target="waitlist-modal"
          class="btn btn-primary !py-1.5 !px-5 !text-[10px] !rounded-lg whitespace-nowrap">
          Join the Waitlist
        </button>
      </div>
    </div>
  </div>

  <!-- Waitlist Modal -->
  <div id="waitlist-modal" class="fixed inset-0 z-[60] hidden overflow-y-auto overflow-x-hidden">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" data-target="waitlist-modal"></div>
      
      <div class="glass-card relative w-full max-w-lg !p-8 lg:!p-12 shadow-2xl scale-95 transition-transform">
        <button 
          data-target="waitlist-modal"
          class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
          <i class="fa fa-times text-xl"></i>
        </button>

        <h3 class="text-3xl font-black mb-4 bg-gradient-to-r from-primary to-blue-400 bg-clip-text text-transparent">
          Join the Beta Waitlist
        </h3>
        <p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
          Get early access to our upcoming procurement software. We'll notify you as soon as the beta version is ready for a look.
        </p>

        <form action="{{ site.Params.contact_form_action }}" method="POST">
          <input type="hidden" name="Subject" value="Procurement Software Waitlist Signup">
          <div class="mb-6">
            <label for="waitlist-email" class="block text-sm font-bold uppercase tracking-wider mb-3 opacity-70">
              Your Email Address <span class="text-primary">*</span>
            </label>
            <input
              id="waitlist-email"
              name="email"
              class="w-full bg-white/50 dark:bg-slate-800/50 border border-white/20 dark:border-white/10 rounded-2xl px-6 py-4 focus:ring-2 focus:ring-primary outline-none transition-all"
              placeholder="name@company.com"
              type="email" required />
          </div>
          <button type="submit" class="btn btn-primary w-full py-4 text-sm flex justify-center items-center group">
            Secure My Spot
            <i class="fa fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const modalTriggers = document.querySelectorAll('[data-target="waitlist-modal"]');
      const modal = document.getElementById('waitlist-modal');
      
      modalTriggers.forEach(trigger => {
        trigger.addEventListener('click', function() {
          modal.classList.toggle('hidden');
          document.body.classList.toggle('overflow-hidden');
          
          // Animation trigger
          const modalBox = modal.querySelector('.glass-card');
          if (!modal.classList.contains('hidden')) {
            setTimeout(() => modalBox.classList.replace('scale-95', 'scale-100'), 10);
          } else {
            modalBox.classList.replace('scale-100', 'scale-95');
          }
        });
      });
    });
  </script>
{{ end }}
