<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgLR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e6fb8"/>
      <stop offset="100%" stop-color="#0d3d6e"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fa"/>
    </linearGradient>
    <filter id="shadowLR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgLR)"/>

  <!-- Subtle road lines bottom -->
  <g opacity="0.18">
    <rect x="120" y="820" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="300" y="820" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="480" y="820" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="660" y="820" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="840" y="820" width="64" height="14" rx="7" fill="#ffffff"/>
  </g>

  <!-- Receipt/document behind truck -->
  <g filter="url(#shadowLR)" transform="translate(580, 130) rotate(10)">
    <rect x="0" y="0" width="280" height="340" rx="20" fill="#fff8e1"/>
    <text x="140" y="110" font-family="Arial, sans-serif" font-size="100" font-weight="900" fill="#0d3d6e" text-anchor="middle">LR</text>
    <rect x="30" y="145" width="220" height="2" fill="#1e6fb8" opacity="0.4"/>
    <rect x="30" y="170" width="220" height="10" rx="5" fill="#1e6fb8" opacity="0.35"/>
    <rect x="30" y="195" width="180" height="10" rx="5" fill="#1e6fb8" opacity="0.35"/>
    <rect x="30" y="220" width="200" height="10" rx="5" fill="#1e6fb8" opacity="0.35"/>
    <rect x="30" y="245" width="160" height="10" rx="5" fill="#1e6fb8" opacity="0.35"/>
    <rect x="30" y="270" width="190" height="10" rx="5" fill="#1e6fb8" opacity="0.35"/>
  </g>

  <!-- Truck (cab + container) -->
  <g filter="url(#shadowLR)" transform="translate(110, 380)">
    <!-- Container/trailer -->
    <rect x="220" y="40" width="500" height="280" rx="20" fill="url(#truckBody)"/>
    <!-- container details -->
    <rect x="250" y="80" width="440" height="200" rx="8" fill="none" stroke="#1e6fb8" stroke-width="6" opacity="0.35"/>
    <line x1="470" y1="80" x2="470" y2="280" stroke="#1e6fb8" stroke-width="6" opacity="0.35"/>

    <!-- Truck cab -->
    <path d="M 30 140 L 30 320 L 220 320 L 220 40 L 130 40 Q 100 40 90 70 L 60 130 Q 50 140 30 140 Z" fill="url(#truckBody)"/>
    <!-- Windshield -->
    <path d="M 110 70 Q 100 70 95 90 L 75 130 Q 70 140 80 140 L 200 140 L 200 70 Z" fill="#4fa3e3" opacity="0.85"/>
    <!-- Cab door line -->
    <line x1="155" y1="140" x2="155" y2="320" stroke="#1e6fb8" stroke-width="4" opacity="0.3"/>

    <!-- Wheels -->
    <circle cx="130" cy="340" r="58" fill="#1a1a1a"/>
    <circle cx="130" cy="340" r="28" fill="#4a4a4a"/>
    <circle cx="130" cy="340" r="12" fill="#1a1a1a"/>

    <circle cx="430" cy="340" r="58" fill="#1a1a1a"/>
    <circle cx="430" cy="340" r="28" fill="#4a4a4a"/>
    <circle cx="430" cy="340" r="12" fill="#1a1a1a"/>

    <circle cx="560" cy="340" r="58" fill="#1a1a1a"/>
    <circle cx="560" cy="340" r="28" fill="#4a4a4a"/>
    <circle cx="560" cy="340" r="12" fill="#1a1a1a"/>

    <!-- Headlight -->
    <circle cx="50" cy="220" r="14" fill="#ffd54a"/>
  </g>
</svg>
