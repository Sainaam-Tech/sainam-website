<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgPM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a8a5c"/>
      <stop offset="100%" stop-color="#0a3d28"/>
    </linearGradient>
    <linearGradient id="pumpBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0ea"/>
    </linearGradient>
    <filter id="shadowPM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgPM)"/>

  <!-- Subtle ground/baseline dashes (mirrors LR road) -->
  <g opacity="0.18">
    <rect x="120" y="820" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="300" y="820" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="480" y="820" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="660" y="820" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="840" y="820" width="64" height="14" rx="7" fill="#ffffff"/>
  </g>

  <!-- Offer card behind pump (mirrors LR receipt) -->
  <g filter="url(#shadowPM)" transform="translate(610, 130) rotate(10)">
    <rect x="0" y="0" width="280" height="340" rx="20" fill="#fff8e1"/>
    <text x="140" y="120" font-family="Arial, sans-serif" font-size="100" font-weight="900" fill="#0a3d28" text-anchor="middle">PM</text>
    <rect x="30" y="155" width="220" height="2" fill="#1a8a5c" opacity="0.4"/>
    <!-- offer % symbol and tag lines -->
    <text x="60" y="225" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="#1a8a5c">%</text>
    <rect x="130" y="185" width="120" height="12" rx="6" fill="#1a8a5c" opacity="0.7"/>
    <rect x="130" y="208" width="100" height="10" rx="5" fill="#1a8a5c" opacity="0.35"/>
    <rect x="130" y="228" width="110" height="10" rx="5" fill="#1a8a5c" opacity="0.35"/>
    <rect x="30" y="265" width="220" height="10" rx="5" fill="#1a8a5c" opacity="0.35"/>
    <rect x="30" y="290" width="180" height="10" rx="5" fill="#1a8a5c" opacity="0.35"/>
  </g>

  <!-- ===== FUEL PUMP ===== -->
  <g filter="url(#shadowPM)" transform="translate(110, 320)">

    <!-- Hose curving from pump top-right to nozzle -->
    <path d="M 360 60 Q 480 60 495 150 Q 502 220 495 290 Q 490 340 525 340 L 580 340 Q 600 340 600 320 L 600 180"
          stroke="#e8f0ea" stroke-width="32" fill="none" stroke-linecap="round"/>

    <!-- Nozzle handle -->
    <g transform="translate(564, 100)">
      <rect x="0" y="0" width="72" height="100" rx="12" fill="url(#pumpBody)"/>
      <rect x="18" y="-32" width="36" height="42" rx="6" fill="url(#pumpBody)"/>
      <rect x="24" y="-48" width="24" height="20" rx="4" fill="#0a3d28" opacity="0.55"/>
      <path d="M 8 42 L 8 76 Q 8 86 18 86 L 28 86 Q 36 86 36 76 L 36 50 Z" fill="#0a3d28" opacity="0.55"/>
    </g>

    <!-- Pump top cap -->
    <rect x="20" y="0" width="340" height="50" rx="18" fill="url(#pumpBody)"/>

    <!-- Pump main tower body -->
    <rect x="40" y="40" width="300" height="450" rx="28" fill="url(#pumpBody)"/>

    <!-- Display screen -->
    <rect x="75" y="80" width="230" height="120" rx="14" fill="#0a3d28"/>
    <text x="190" y="148" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#1a8a5c" text-anchor="middle" letter-spacing="3">88.88</text>
    <rect x="95" y="166" width="60" height="14" rx="3" fill="#1a8a5c" opacity="0.7"/>
    <rect x="170" y="166" width="60" height="14" rx="3" fill="#1a8a5c" opacity="0.35"/>
    <rect x="245" y="166" width="40" height="14" rx="3" fill="#1a8a5c" opacity="0.35"/>

    <!-- Brand plate (mirrors truck container panel feel) -->
    <rect x="75" y="225" width="230" height="80" rx="14" fill="none" stroke="#1a8a5c" stroke-width="5" opacity="0.35"/>
    <!-- fuel droplet emblem -->
    <g transform="translate(120, 265)">
      <path d="M 0 -24 C -22 0, -30 18, -30 26 C -30 42, -16 54, 0 54 C 16 54, 30 42, 30 26 C 30 18, 22 0, 0 -24 Z" fill="#1a8a5c"/>
    </g>
    <rect x="170" y="252" width="115" height="12" rx="6" fill="#1a8a5c" opacity="0.7"/>
    <rect x="170" y="275" width="90" height="10" rx="5" fill="#1a8a5c" opacity="0.35"/>

    <!-- Lower panel lines -->
    <rect x="75" y="330" width="230" height="140" rx="14" fill="none" stroke="#1a8a5c" stroke-width="5" opacity="0.3"/>
    <rect x="95" y="355" width="190" height="10" rx="5" fill="#1a8a5c" opacity="0.3"/>
    <rect x="95" y="380" width="150" height="10" rx="5" fill="#1a8a5c" opacity="0.3"/>
    <rect x="95" y="405" width="170" height="10" rx="5" fill="#1a8a5c" opacity="0.3"/>
    <rect x="95" y="430" width="130" height="10" rx="5" fill="#1a8a5c" opacity="0.3"/>

    <!-- Base platform -->
    <rect x="10" y="490" width="360" height="30" rx="8" fill="url(#pumpBody)"/>
  </g>
</svg>
