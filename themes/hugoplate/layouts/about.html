{{ define "main" }}
  <section class="section pt-24 pb-20">
    <div class="container">
      <div class="row justify-center">
        <div class="md:col-10 lg:col-8 text-center">
          <div class="glass-card !p-12 lg:!p-20">
            {{ partial "image" (dict "Src" .Params.image "Context" .Page "Alt" .Title "Class" "mx-auto mb-10 rounded-full ring-8 ring-primary/10 shadow-2xl" "Size" "200x200") }}
            <h1 class="text-4xl lg:text-6xl font-black mb-10 bg-gradient-to-r from-primary to-blue-400 bg-clip-text text-transparent">
              {{ .Title }}
            </h1>
            <div class="content prose prose-lg dark:prose-invert max-w-none text-left">
              {{ .Content }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
{{ end }}
