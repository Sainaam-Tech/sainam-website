{{ define "main" }}
  {{ partial "page-header" . }}

  <section class="section pt-24 pb-20">
    <div class="container">
      <div class="row">
        <div class="md:col-10 lg:col-8 mx-auto">
          <div class="glass-card !p-8 lg:!p-12">
            
            <!-- Toggle Tabs (Glass style) -->
            <div class="flex justify-center mb-12">
              <div class="inline-flex p-1 bg-white/20 dark:bg-slate-800/20 backdrop-blur-md rounded-2xl border border-white/20 dark:border-white/10 shadow-inner">
                <button
                  id="btn-booking"
                  class="px-6 py-3 rounded-xl font-bold transition-all duration-300 active:scale-95 bg-primary text-white shadow-lg"
                  onclick="showTab('booking')">
                  <i class="fa-regular fa-calendar-check mr-2"></i> Book a Consultation
                </button>
                <button
                  id="btn-message"
                  class="px-6 py-3 rounded-xl font-bold transition-all duration-300 active:scale-95 text-slate-700 dark:text-slate-300 hover:bg-white/30 dark:hover:bg-slate-700/30"
                  onclick="showTab('message')">
                  <i class="fa-regular fa-envelope mr-2"></i> Send a Message
                </button>
              </div>
            </div>

            <!-- Calendly Inline Embed -->
            <div id="tab-booking" class="transition-opacity duration-500">
              <div
                class="calendly-inline-widget"
                data-url="https://calendly.com/sainam-tech11/30min"
                style="min-width:320px; height:700px;">
              </div>
            </div>

            <!-- Contact Form -->
            <div id="tab-message" style="display:none;" class="transition-opacity duration-500">
              <h2 class="text-3xl lg:text-4xl font-black mb-10 text-center bg-gradient-to-r from-primary to-blue-400 bg-clip-text text-transparent">
                Send us a Message
              </h2>
              <form action="{{ site.Params.contact_form_action }}" method="POST">
                <div class="mb-8">
                  <label for="name" class="block text-sm font-bold uppercase tracking-wider mb-3 opacity-70">
                    Full Name <span class="text-primary">*</span>
                  </label>
                  <input
                    id="name"
                    name="name"
                    class="w-full bg-white/50 dark:bg-slate-800/50 border border-white/20 dark:border-white/10 rounded-2xl px-6 py-4 focus:ring-2 focus:ring-primary outline-none transition-all"
                    placeholder="John Doe"
                    type="text" required />
                </div>
                <div class="mb-8">
                  <label for="email" class="block text-sm font-bold uppercase tracking-wider mb-3 opacity-70">
                    Email Address <span class="text-primary">*</span>
                  </label>
                  <input
                    id="email"
                    name="email"
                    class="w-full bg-white/50 dark:bg-slate-800/50 border border-white/20 dark:border-white/10 rounded-2xl px-6 py-4 focus:ring-2 focus:ring-primary outline-none transition-all"
                    placeholder="john.doe@email.com"
                    type="email" required />
                </div>
                <div class="mb-8">
                  <label for="message" class="block text-sm font-bold uppercase tracking-wider mb-3 opacity-70">
                    Message <span class="text-primary">*</span>
                  </label>
                  <textarea
                    id="message"
                    name="message"
                    class="w-full bg-white/50 dark:bg-slate-800/50 border border-white/20 dark:border-white/10 rounded-2xl px-6 py-4 focus:ring-2 focus:ring-primary outline-none transition-all"
                    placeholder="Tell us about your project..."
                    rows="6" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-full py-5 text-base flex justify-center items-center group">
                  Send Message
                  <i class="fa fa-paper-plane ml-3 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                </button>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Google Map -->
  {{ with site.Params.google_map }}
    {{ if .enable }}
      <div
        id="map"
        class="w-full grayscale dark:invert dark:hue-rotate-180 opacity-80"
        style="height: 400px;"
        data-latitude="{{ .map_latitude }}"
        data-longitude="{{ .map_longitude }}"
        data-marker="{{ .map_marker | relURL }}"
        data-marker-name="{{ site.Title }}"></div>
    {{ end }}
  {{ end }}

  <!-- Calendly widget assets -->
  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
  <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>

  <script>
    function showTab(tab) {
      const messageTab = document.getElementById('tab-message');
      const bookingTab = document.getElementById('tab-booking');
      const btnMessage = document.getElementById('btn-message');
      const btnBooking = document.getElementById('btn-booking');

      if (tab === 'booking') {
        bookingTab.style.display = 'block';
        messageTab.style.display = 'none';
        
        // Update button styles
        btnBooking.classList.add('bg-primary', 'text-white', 'shadow-lg');
        btnBooking.classList.remove('text-slate-700', 'dark:text-slate-300', 'hover:bg-white/30', 'dark:hover:bg-slate-700/30');
        
        btnMessage.classList.remove('bg-primary', 'text-white', 'shadow-lg');
        btnMessage.classList.add('text-slate-700', 'dark:text-slate-300', 'hover:bg-white/30', 'dark:hover:bg-slate-700/30');
      } else {
        messageTab.style.display = 'block';
        bookingTab.style.display = 'none';
        
        // Update button styles
        btnMessage.classList.add('bg-primary', 'text-white', 'shadow-lg');
        btnMessage.classList.remove('text-slate-700', 'dark:text-slate-300', 'hover:bg-white/30', 'dark:hover:bg-slate-700/30');
        
        btnBooking.classList.remove('bg-primary', 'text-white', 'shadow-lg');
        btnBooking.classList.add('text-slate-700', 'dark:text-slate-300', 'hover:bg-white/30', 'dark:hover:bg-slate-700/30');
      }
    }
  </script>

  {{ if site.Params.google_map.enable }}
    {{ $gmap:= resources.Get "plugins/maps/google-map.js" }}
    <script defer src="{{ $gmap.RelPermalink }}"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key={{ site.Params.google_map.map_api_key }}&libraries=places"></script>
  {{ end }}

{{ end }}
